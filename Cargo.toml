[package]
name = "all-MiniLM-L6-v2-restapi-service"
version = "1.0.0"
edition = "2021"

[dependencies]
rust-bert = "0.23.0"
tokio = { version = "1.44", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "net",
  "time",
] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
